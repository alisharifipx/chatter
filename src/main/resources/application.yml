server:
  port: 8080

spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  application:
    name: chatter
  datasource:
    url: jdbc:postgresql://localhost:5432/security_users
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations:
      - classpath:db/migration

logging:
  level:
    root: INFO
