import org.flywaydb.gradle.task.FlywayMigrateTask

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath(libs.postgresql)
        classpath(libs.flyway.database.postgresql)
    }
}

def loadDotEnv() {
    def env = [:]
    def dotEnvFile = file(".env")
    if (dotEnvFile.exists()) {
        dotEnvFile.eachLine { line ->
            def parts = line.split("=", 2)
            if (parts.length == 2) {
                env[parts[0].trim()] = parts[1].trim()
            }
        }
    }
    return env
}

plugins {
    id 'java'
    alias(libs.plugins.flyway)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.typescript.generator)
}

group = 'au.com'
version = '1.0.0-SNAPSHOT'
description = 'chatter'

// .env file
def dotEnv = loadDotEnv()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

flyway {
    url = 'jdbc:postgresql://localhost:5432/security_users'
    user = dotEnv['DB_USERNAME']
    password = dotEnv['DB_PASSWORD']
    cleanDisabled = false
}

tasks.register('flywaySeed', FlywayMigrateTask) {
    description = 'Runs only the seed data migrations from db/data'
    group = 'database'
    locations = ['filesystem:src/main/resources/db/data']
    table = 'flyway_seed_history'
    baselineOnMigrate = true
    baselineVersion = '0'
}

generateTypeScript {
    jsonLibrary = 'jackson2'
    outputFile = '../frontend/src/generated/types.ts'
    outputFileType = 'implementationFile'
    outputKind = 'module'
    mapClasses = 'asInterfaces'
    noFileComment = true
    stringQuotes = "singleQuotes"
    sortDeclarations = true
    sortTypeDeclarations = true
    optionalProperties = 'useSpecifiedAnnotations'
    optionalAnnotations = [
            'au.com.chatter.annotation.typescript.TsOptional',
            'au.com.chatter.annotation.typescript.TsNullable'
    ]

    classPatterns = ['au.com.chatter.controller.**Dto']

    excludeClasses = []

    excludeClassPatterns = []

    excludePropertyAnnotations = ["com.fasterxml.jackson.annotation.JsonIgnore"]
}
