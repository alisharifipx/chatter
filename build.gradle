plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'cz.habarta.typescript-generator' version '3.2.1263'
}

group = 'au.com'
version = '0.0.1-SNAPSHOT'
description = 'chatter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'

    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

generateTypeScript {
    jsonLibrary = 'jackson2'
    outputFile = 'web/src/generated/types.ts'
    outputFileType = 'implementationFile'
    outputKind = 'module'
    mapClasses = 'asInterfaces'
    noFileComment = true
    stringQuotes = "singleQuotes"
    sortDeclarations = true
    sortTypeDeclarations = true
    optionalProperties = 'useSpecifiedAnnotations'
    optionalAnnotations = [
            'au.com.chatter.annotation.typescript.TsOptional',
            'au.com.chatter.annotation.typescript.TsNullable'
    ]

    classPatterns = ['au.com.chatter.controller.**Dto']

    excludeClasses = []

    excludeClassPatterns = []

    excludePropertyAnnotations = ["com.fasterxml.jackson.annotation.JsonIgnore"]
}
